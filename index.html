/* Unified KPI dashboard system */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin:16px 0 22px}
.kpi-card{position:relative;overflow:hidden;border:1px solid var(--line,#e2e8f0);border-radius:16px;padding:17px 18px;background:linear-gradient(145deg,#fff,#f8fafc);box-shadow:0 5px 18px rgba(15,23,42,.055);min-height:112px}
.kpi-card:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--kpi-accent,#2563eb)}
.kpi-card .kpi-label{font-size:12px;font-weight:700;letter-spacing:.035em;text-transform:uppercase;color:#64748b;margin-bottom:10px}
.kpi-card .kpi-value{font-size:clamp(24px,2.4vw,32px);font-weight:800;letter-spacing:-.035em;color:#0f172a;line-height:1.12;overflow-wrap:anywhere}
.kpi-card .kpi-note{font-size:12px;color:#64748b;margin-top:8px}
.kpi-card.blue{--kpi-accent:#2563eb}.kpi-card.green{--kpi-accent:#059669}.kpi-card.violet{--kpi-accent:#7c3aed}.kpi-card.amber{--kpi-accent:#d97706}.kpi-card.rose{--kpi-accent:#e11d48}.kpi-card.cyan{--kpi-accent:#0891b2}
.kpi-progress{height:7px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:10px}
.kpi-progress>span{display:block;height:100%;border-radius:99px;background:var(--kpi-accent,#2563eb);max-width:100%}
.kpi-section{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 10px}
.kpi-section h3{margin:0}
.kpi-badge{font-size:11px;font-weight:700;border-radius:999px;padding:5px 9px;background:#eff6ff;color:#1d4ed8}
@media(max-width:620px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.kpi-card{padding:13px;min-height:100px}.kpi-card .kpi-value{font-size:23px}}

/* Dashboard layout aligned to the requested clean blue-and-white reference */
.dashboard-panels{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin:14px 0 20px;align-items:stretch}
.dash-panel{min-width:0;padding:17px;background:linear-gradient(180deg,#fff,#fbfdff);border-color:#dce8f6;box-shadow:0 5px 18px #0b3b7410}

function achievementBadge(value){const p=Number(value);if(!Number.isFinite(p))return '<span class="achievement ach-neutral">—</span>';const cls=p<25?'ach-red':p<50?'ach-lightred':p<75?'ach-yellow':p<=100?'ach-green':'ach-darkgreen';return `<span class="achievement ${cls}">${p.toFixed(1).replace(/\.0$/,'')}%</span>`}

const today=()=>new Date().toLocaleDateString('en-CA');
let staffDirectory=[], doms=[], contests=[];
let user=null,page='dashboard',loginMessage='',loginType='info',date=today(),month=today().slice(0,7);
let profile=null,branches=[],roms=[],divisions=[],mappings=[],targets=[],bases=[],bod=[],eod=[],calling=[],correctionRequests=[],commitmentReviews=[],zohReviewRequests=[],cihReports=[],goldLoanWeekly=[];

function authErr(e){const m={'auth/invalid-credential':'Email or password is incorrect.','auth/invalid-email':'Enter a valid email address.','auth/user-disabled':'This account is disabled. Contact the administrator.','auth/too-many-requests':'Too many attempts. Wait a while and try again.','auth/network-request-failed':'Network error. Check your connection.','auth/operation-not-allowed':'Email/Password sign-in is not enabled in Firebase Authentication.','auth/invalid-api-key':'Firebase API key configuration is invalid.'};return m[e?.code]||`Sign-in failed (${e?.code||'unknown'}): ${e?.message||'Please try again.'}`;}
async function signIn(){const email=$('email')?.value.trim(),password=$('password')?.value;if(!email||!password){msg('Enter your registered email address and password.','error');return}const b=$('loginBtn');b.disabled=true;b.textContent='Signing in…';msg('Connecting to Firebase Authentication…');try{await authPersistenceReady;await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);await auth.signInWithEmailAndPassword(email,password)}catch(e){msg(authErr(e),'error');b.disabled=false;b.textContent='Sign in'}}

function roleIs(...roles){return !!user&&roles.includes(user.role)}

function go(p,fromPop=false){if(roleIs('ZOH')&&['bases','bod','eod','users'].includes(p))p='dashboard';if(p==='branchReview'&&selectedBranch==='ALL'){alert('Select a branch first from the dashboard or Target Not Met Review.');return}if(!['businessReportHub','tasksHub','appsHub','profileHub','dashboard','statePerformance','intelligence','actionPlan','alerts','analytics3','branchYtd','domDashboard','romDashboard','reports','calling','performance','reviews','cih','history','targets','mapping','bases','bod','eod','glp','branchReview','users','reset','approvals','quality','contests'].includes(p)){console.warn('Unknown page:',p);return}if(['dashboard','domDashboard','romDashboard'].includes(p)){selectedDivision='ALL';selectedRom='ALL';selectedBranch='ALL';dashboardDrillLevel=roleIs('ZOH','SYSTEM_ADMIN')?'division':'rom'}page=p;if(!fromPop){try{history.pushState({tnHubPage:p},'',location.href)}catch(e){}}document.querySelector('.side')?.classList.remove('open');render();window.scrollTo({top:0,behavior:'instant'})}

function scopeBranches(){
  if(!user)return[];
  let out=[];
  if(roleIs('ZOH','SYSTEM_ADMIN'))out=branches.slice();
  else if(user.role==='DOM')out=branches.filter(b=>normScope(b.divisionId)===normScope(user.divisionId));
  else if(user.role==='ROM')out=branches.filter(b=>normScope(b.regionId)===normScope(user.regionId)||normScope(b.romCode)===normScope(user.empCode));
  else return[];
  if(roleIs('ZOH','SYSTEM_ADMIN')&&selectedDivision!=='ALL')out=out.filter(b=>normScope(b.divisionId)===normScope(selectedDivision));
  if(user.role==='DOM')out=out.filter(b=>normScope(b.divisionId)===normScope(user.divisionId));
  if(user.role==='ROM')out=out.filter(b=>normScope(b.regionId)===normScope(user.regionId)||normScope(b.romCode)===normScope(user.empCode));
  if(selectedRom!=='ALL')out=out.filter(b=>String(b.romCode||'')===selectedRom||String(b.regionId||'')===selectedRom);
  if(selectedBranch!=='ALL')out=out.filter(b=>String(b.branchCode)===selectedBranch);

    out=out.filter(b=>normScope(b.branchName||b.name||'').includes(term)||normScope(b.branchCode||b.code||'').includes(term));

  return out;
}
function branchRomCode(b){return String(b?.romCode||b?.regionId||b?.regionCode||'Unassigned').trim()}
function romBranchesFor(code){const target=normScope(code);return scopeBranches().filter(b=>normScope(branchRomCode(b))===target)}
function visibleRows(list){const codes=new Set(scopeBranches().map(b=>String(b.branchCode)));return list.filter(x=>codes.has(String(x.branchCode)))}
function k(branch,day,metric){return `${branch}|${day}|${metric}`}
function monthKey(d){return String(d||'').slice(0,7)}
function n(v){return Number.isFinite(Number(v))?Number(v):0}
function money(v){return n(v).toLocaleString('en-IN')}
function metricUnit(metric){return ['ELA','Insurance'].includes(normMetric(metric))?'count':'amount'}
function metricValue(v,metric){const val=n(v);return metricUnit(metric)==='amount'?'₹ '+money(val):money(val)+' nos'}
function metricGapValue(v,metric){return (n(v)<0?'−':'')+metricValue(Math.abs(n(v)),metric)}
function sumForMetric(rows,metric,field){return rows.filter(x=>normMetric(x.metric||x.product||x.productName||x.targetType)===normMetric(metric)).reduce((a,x)=>a+n(x[field]??0),0)}
function head(title,sub){return `<div class="head"><div><div class="eyebrow">${esc(user.role)} WORKSPACE</div><h2>${esc(title)}</h2><div class="sub">${esc(sub)}</div></div><span class="pill">Live Firestore data</span></div>`}
function filters(){return `<div class="filters"><div class="field"><label>Reporting date</label><input type="date" value="${esc(date)}" onchange="date=this.value;month=date.slice(0,7);refreshData().then(render)"></div><div class="field"><label>Reporting month</label><input type="month" value="${esc(month)}" onchange="month=this.value;refreshData().then(render)"></div></div>`}

async function readCollection(name){
 const base=db.collection(name);
 // Query by the same organization scope enforced by Firestore rules; rules are not filters.
 if(!roleIs('ZOH','SYSTEM_ADMIN')){
   if(user.role==='DOM'){
     if(!user.divisionId)return [];
     const snap=await base.where('divisionId','==',String(user.divisionId)).get();
     return snap.docs.map(d=>({id:d.id,...d.data()}));
   }
   if(user.role==='ROM'){
     const queries=[];
     if(user.empCode)queries.push(base.where('romCode','==',String(user.empCode)).get());
     if(user.regionId)queries.push(base.where('regionId','==',String(user.regionId)).get());
     if(!queries.length)return [];
     const snaps=await Promise.all(queries),unique=new Map();
     snaps.forEach(s=>s.docs.forEach(d=>unique.set(d.id,{id:d.id,...d.data()})));
     return [...unique.values()];
   }
   return [];
 }
 const snap=await base.get();return snap.docs.map(d=>({id:d.id,...d.data()}));
}
async function loadProfile(fu){try{const s=await db.collection('users').doc(fu.uid).get();if(!s.exists)throw Object.assign(new Error('No Firestore profile at users/'+fu.uid),{code:'profile/not-found'});const p=s.data()||{},r=String(p.role||'').toUpperCase();if(p.active!==true||!['SYSTEM_ADMIN','ZOH','DOM','ROM'].includes(r))throw Object.assign(new Error('Profile must have active=true and role SYSTEM_ADMIN, ZOH, DOM, or ROM.'),{code:'profile/inactive-or-invalid'});profile=p;user={uid:fu.uid,email:fu.email||'',role:r,name:String(p.displayName||p.name||p.fullName||p.empCode||'Staff member'),empCode:String(p.empCode||''),divisionId:String(p.divisionId||''),regionId:String(p.regionId||p.regionID||'')};}
catch(e){console.error('Profile load failed',e);throw e}}
async function refreshData(){if(!user)return;const names=['organizationMappings','branches','monthlyTargets','elaBases','bodCommitments','eodReports','callingReports','correctionRequests','commitmentReviews','zohReviewRequests','cihReports','goldLoanWeekly'];const results=await Promise.all(names.map(async name=>{try{return [name,await readCollection(name),null]}catch(e){console.warn('Read failed:',name,e);return [name,[],{code:e.code||'unknown',message:e.message}]} }));const data=Object.fromEntries(results.map(([name,rows])=>[name,rows]));mappings=data.organizationMappings;branches=data.branches.filter(x=>x.active!==false);roms=[];divisions=[];
  doms=[];staffDirectory=[];
  if(roleIs('ZOH','SYSTEM_ADMIN')){
    try{
      const us=await db.collection('users').get();
      staffDirectory=us.docs.map(d=>({id:d.id,...d.data(),role:String(d.data().role||'').toUpperCase(),empCode:String(d.data().empCode||''),name:String(d.data().displayName||d.data().name||d.data().empCode||'Staff')}));
      roms=staffDirectory.filter(p=>p.active===true&&p.role==='ROM');
      doms=staffDirectory.filter(p=>p.active===true&&p.role==='DOM');
    }catch(e){console.warn('Staff directory load failed:',e);window.collectionErrors=[...(window.collectionErrors||[]),{name:'users directory',code:e.code||'unknown',message:e.message}];}
  }else if(user.role==='DOM'){
    try{
      const us=await db.collection('users').where('role','==','ROM').where('active','==',true).where('divisionId','==',user.divisionId).get();
      roms=us.docs.map(d=>({id:d.id,...d.data(),empCode:String(d.data().empCode||''),name:String(d.data().displayName||d.data().empCode||'ROM')}));
    }catch(e){console.warn('ROM dropdown load failed:',e);window.collectionErrors=[...(window.collectionErrors||[]),{name:'users (ROM list)',code:e.code||'unknown',message:e.message}];}
  }
  targets=data.monthlyTargets;bases=data.elaBases;bod=data.bodCommitments;eod=data.eodReports;calling=data.callingReports;correctionRequests=data.correctionRequests;commitmentReviews=data.commitmentReviews;zohReviewRequests=data.zohReviewRequests;cihReports=data.cihReports;goldLoanWeekly=data.goldLoanWeekly||[];
 contests=[];if(roleIs('ZOH','SYSTEM_ADMIN')){try{contests=await readCollection('contests')}catch(e){window.__contestLoadError={name:'contests',code:e.code||'unknown',message:e.message};}}
 // Support mapping records as the canonical branch assignment source; do not fabricate branch assignments.
 const branchMaps=mappings.filter(x=>x.type==='branchAssignment');if(branchMaps.length){
   const merged=new Map();
   branches.forEach(b=>merged.set(String(b.branchCode||b.code||''),{...b,branchCode:String(b.branchCode||b.code||'')}));
   branchMaps.forEach(m=>{const code=String(m.branchCode||'');if(!code)return;const existing=merged.get(code)||{};merged.set(code,{...m,...existing,branchCode:code,branchName:existing.branchName||m.branchName,romCode:existing.romCode||m.romCode,divisionId:existing.divisionId||m.divisionId,regionId:existing.regionId||m.regionId,active:existing.active!==undefined?existing.active:true});});
   branches=[...merged.values()];
 }
 // Expose exact collection failures instead of leaving a spinner indefinitely.

// Division -> ROM -> Branch dashboard filters. UI filters do not replace Firestore security rules.
let selectedDivision='ALL', selectedRom='ALL', selectedBranch='ALL', branchSearch='', dashboardDrillLevel='division';
const normScope=v=>String(v??'').trim().toLowerCase();
function scopedRomProfiles(){
  if(!user) return [];
  let list=roms.filter(r=>String(r.role||'').toUpperCase()==='ROM' && r.active===true);
  if(user.role==='DOM') list=list.filter(r=>normScope(r.divisionId)===normScope(user.divisionId));
  if(user.role==='ZOH'||user.role==='SYSTEM_ADMIN'){
    if(selectedDivision!=='ALL') list=list.filter(r=>normScope(r.divisionId)===normScope(selectedDivision));
  }
  return list;
}
function setDashboardDrill(level){
  dashboardDrillLevel=level;
  if(level==='division'){selectedDivision='ALL';selectedRom='ALL';selectedBranch='ALL';branchSearch='';}
  if(level==='rom'){selectedRom='ALL';selectedBranch='ALL';}
  if(level==='branch'){selectedBranch='ALL';}
  render();
}
function updateBranchSearch(input){
  const value=input.value;
  const start=input.selectionStart;
  const end=input.selectionEnd;
  branchSearch=value;
  selectedBranch='ALL';
  render();
  const next=document.getElementById('branchSearchInput');
  if(next){
    next.focus({preventScroll:true});
    try{next.setSelectionRange(start,end)}catch(_){}
  }
}
function scopeFilterPanel(){
  if(!user) return '';
  const global=roleIs('ZOH','SYSTEM_ADMIN');
  const divs=[...new Set(branches.map(b=>String(b.divisionId||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  let romList=scopedRomProfiles();
  let bs=branches.slice();
  if(!global){
    if(user.role==='DOM')bs=bs.filter(b=>normScope(b.divisionId)===normScope(user.divisionId));
    if(user.role==='ROM')bs=bs.filter(b=>normScope(b.regionId)===normScope(user.regionId)||String(b.romCode||'')===user.empCode);
  }
  if(selectedDivision!=='ALL')bs=bs.filter(b=>normScope(b.divisionId)===normScope(selectedDivision));
  if(selectedRom!=='ALL')bs=bs.filter(b=>String(b.romCode||'')===selectedRom||String(b.regionId||'')===selectedRom);
  if(selectedBranch!=='ALL')bs=bs.filter(b=>String(b.branchCode)===selectedBranch);
  if(branchSearch.trim()){
    const term=normScope(branchSearch);
    bs=bs.filter(b=>normScope(b.branchName||b.name||'').includes(term)||normScope(b.branchCode||b.code||'').includes(term));
  }
  const effectiveDivision=global?selectedDivision:(user.role==='DOM'?user.divisionId:'ALL');
  const effectiveRom=selectedRom;
  const branchOptions=bs.slice().sort((a,b)=>String(a.branchName||a.name||a.branchCode).localeCompare(String(b.branchName||b.name||b.branchCode)));
  return `<section class="card" style="margin-bottom:16px;border-top:3px solid var(--blue)">
    <div class="section" style="margin-top:0"><h3>Dashboard filters</h3><span>Division → ROM → Branch</span></div>
    <div class="actions" style="margin:10px 0 14px">
      <button class="btn ${dashboardDrillLevel==='division'?'primary':'outline'} small" onclick="setDashboardDrill('division')">Division-wise data</button>
      <button class="btn ${dashboardDrillLevel==='rom'?'primary':'outline'} small" onclick="setDashboardDrill('rom')">ROM-wise data</button>
      <button class="btn ${dashboardDrillLevel==='branch'?'primary':'outline'} small" onclick="setDashboardDrill('branch')">Branch-wise data</button>
    </div>
    <div class="filters">

 }
 alerts.sort((a,b)=>(a.level==='urgent'?0:1)-(b.level==='urgent'?0:1)||a.name.localeCompare(b.name));

async function saveContest(ev){ev.preventDefault();if(!roleIs('ZOH','SYSTEM_ADMIN'))return;const name=document.getElementById('contestName').value.trim(),startDate=document.getElementById('contestStart').value,endDate=document.getElementById('contestEnd').value,products=[...document.getElementById('contestProducts').selectedOptions].map(o=>o.value),eligibleRoles=[...document.getElementById('contestRoles').selectedOptions].map(o=>o.value);if(!name||!startDate||!endDate||endDate<startDate||!products.length){contestMessage('Enter a contest name, valid date range and at least one product.','error');return}const id=document.getElementById('contestId').value;const payload={name,startDate,endDate,products,eligibleRoles,status:document.getElementById('contestStatus').value,rules:document.getElementById('contestRules').value.trim(),slabs:document.getElementById('contestSlabs').value.trim(),conditions:document.getElementById('contestDescription').value.trim(),incentiveSlabs:document.getElementById('contestSlabs').value.trim(),description:document.getElementById('contestDescription').value.trim(),updatedAt:new Date().toISOString(),updatedBy:user.empCode||user.uid};const btn=document.getElementById('contestSaveBtn');btn.disabled=true;try{if(id)await db.collection('contests').doc(id).set(payload,{merge:true});else await db.collection('contests').add({...payload,createdAt:new Date().toISOString(),createdBy:user.empCode||user.uid});await refreshData();render();alert(id?'Contest updated successfully.':'Contest created successfully.');}catch(e){console.error('Contest save failed',e);contestMessage(`Could not save contest (${e.code||'error'}). Check that the Firestore rules allow ZOH/System Admin to write the contests collection. No existing data was changed by this failed save.`,'error');}finally{const b=document.getElementById('contestSaveBtn');if(b)b.disabled=false}}

function normMetric(v){const x=String(v??'').trim().toLowerCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ');if(['ela','mfi','ela mfi','mfi ela'].includes(x))return 'ELA';if(['gold','gold loan','gl'].includes(x))return 'Gold Loan';if(['fd','fixed deposit','fixed deposits'].includes(x))return 'FD';if(['insurance','ins'].includes(x))return 'Insurance';return String(v??'').trim()}
function metricTarget(branch,metric){
 const wanted=normMetric(metric),bc=String(branch);
 const monthRows=targets.filter(x=>monthKey(x.month||x.targetMonth||x.period||x.targetPeriod)===month&&normMetric(x.metric||x.product||x.targetType)===wanted);
 const matches=monthRows.filter(x=>String(x.branchCode??x.branchId??'')===bc);
 const byUpdated=(a,b)=>{const av=a.updatedAt?.seconds??(Date.parse(a.updatedAt||'')||0),bv=b.updatedAt?.seconds??(Date.parse(b.updatedAt||'')||0);return av-bv};
 const t=matches.sort(byUpdated).slice(-1)[0];
 if(t){
   const method=String(t.method||t.targetMethod||t.allocationMethod||'fixed').toLowerCase();
   const rate=Number(t.rate??t.percentage??t.targetRate??0);
   // Only ELA targets can be calculated as a percentage of the ELA base.
   if(wanted==='ELA'&&(['base','percentage','percent','ela base','base percentage'].includes(method)||t.rate!==undefined||t.percentage!==undefined||t.targetRate!==undefined)){
     const baseType=String(t.baseType||'ELA').toUpperCase();
     const base=baseFor(bc,baseType);
     const explicit=Number(t.targetValue??t.calculatedTarget??t.target??t.value??0);
     return base>0&&rate>=0?Math.ceil(base*rate/100):Math.max(0,explicit||0);
   }
   return Math.max(0,n(t.targetValue??t.value??t.target??t.amount??0));
 }
 // Repair display for a missing branch row when ZOH used a statewide fixed-per-branch allocation.
 // This does not write to Firestore; it uses the common per-branch target from the same month's saved allocation.
 const statewideFixed=monthRows.filter(x=>String(x.allocationScope||'')==='state'&&String(x.allocationMethod||x.method||'').toLowerCase()==='perbranchfixed');
 if(statewideFixed.length){
   const values=statewideFixed.map(x=>n(x.targetValue??x.value??x.target??x.amount??0)).filter(v=>v>=0);
   if(values.length&&values.every(v=>v===values[0]))return values[0];
 }
 return 0;
}
function baseFor(branch,type='ELA'){
 const wanted=String(type||'ELA').toUpperCase();
 if(wanted==='CUSTOMER'||wanted==='REGULAR'||wanted==='REGULAR_CUSTOMER') return Math.max(0,baseFor(branch,'ELA')-baseFor(branch,'ZERO_POS'));
 const aliases=wanted==='ELA'?['ELA','MFI','ELA_BASE']:wanted==='ZERO_POS'?['ZERO_POS','ZERO POS','ZERO-POS']: [wanted];
 const found=bases.filter(v=>String(v.branchCode??v.branchId??'')===String(branch)&&monthKey(v.month||v.reportingMonth||v.period)===month&&aliases.includes(String(v.baseType||v.type||'ELA').toUpperCase().replace(/[- ]+/g,'_'))).sort((a,b)=>{const av=a.updatedAt&&a.updatedAt.seconds?a.updatedAt.seconds:(Date.parse(a.updatedAt||'')||0);const bv=b.updatedAt&&b.updatedAt.seconds?b.updatedAt.seconds:(Date.parse(b.updatedAt||'')||0);return av-bv}).slice(-1)[0];
 return n(found?.baseValue??found?.value??found?.totalCustomerBase??found?.elaBase??found?.base??0);
}

function todayRow(list,branch,day,metric){return list.find(x=>String(x.branchCode)===String(branch)&&String(x.date||x.reportingDate||'')===String(day)&&(metric===undefined||normMetric(x.metric||x.product||x.productName)===normMetric(metric)))}
function mtd(branch,metric){return eod.filter(x=>String(x.branchCode)===String(branch)&&monthKey(x.date||x.reportingDate)===month&&normMetric(x.metric||x.product||x.productName)===normMetric(metric)).reduce((s,x)=>s+n(x.actual??x.achieved??x.amount??x.count??0),0)}
function sumMetric(list,metric){return list.filter(x=>x.metric===metric).reduce((s,x)=>s+n(x.amount??x.actual),0)}

function kpiCard(label,value,note='',tone='blue',progress=null){
  const p=progress===null?'':`<div class="kpi-progress"><span style="width:${Math.max(0,Math.min(100,Number(progress)||0))}%;--kpi-accent:var(--kpi-accent)"></span></div>`;
  return `<div class="kpi-card ${tone}"><div class="kpi-label">${esc(label)}</div><div class="kpi-value">${value}</div><div class="kpi-note">${esc(note)}</div>${p}</div>`;
}
function callingValue(row,field){return Math.max(0,n(row?.[field]));}
function callingTotals(rows,branchCode,forDate=date){
  const x=rows.filter(r=>String(r.branchCode)===String(branchCode)&&String(r.date)===String(forDate));
  return x.reduce((a,r)=>{for(const f of ['notInterested','switchOff','cbRejected','followUp','nonContactable','ringingNoResponse','tbd','disbursed'])a[f]+=callingValue(r,f);return a;},
  {notInterested:0,switchOff:0,cbRejected:0,followUp:0,nonContactable:0,ringingNoResponse:0,tbd:0,disbursed:0});
}

function ytdFmt(value,metric){return ['ELA','Insurance'].includes(normMetric(metric))?n(value).toLocaleString('en-IN'):'₹ '+money(value)}
function branchYtdPage(){
 const bs=scopeBranches();
 const selectedYear=String(month||date||new Date().toISOString().slice(0,7)).slice(0,4);
 const cutoffMonth=String(month||`${selectedYear}-12`).slice(0,7);
 const metrics=['ELA','Gold Loan','FD','Insurance'];
 const mode=window.ytdReportMode||'choose';
 const rowMonth=r=>monthKey(r.date||r.reportingDate||r.month||r.targetMonth||r.period||r.targetPeriod||r.createdAt||'');
 const inYtd=r=>{const mm=rowMonth(r);return mm>=`${selectedYear}-01`&&mm<=cutoffMonth};
 const branchMetric=(b,m,period)=>{
   const code=String(b.branchCode);
   const actualRows=eod.filter(r=>String(r.branchCode)===code&&normMetric(r.metric||r.product||r.productName)===m&&(period==='mtd'?rowMonth(r)===cutoffMonth:inYtd(r)));
   const actual=actualRows.reduce((sum,r)=>sum+n(r.actual??r.achieved??r.disbursementAmount??r.amount??r.count??0),0);
   const targetRows=targets.filter(t=>String(t.branchCode??t.branchId??'')===code&&normMetric(t.metric||t.product||t.productName||t.targetType)===m&&rowMonth(t)<=cutoffMonth&&(period==='ytd'?rowMonth(t)>=`${selectedYear}-01`:rowMonth(t)===cutoffMonth));
   const target=targetRows.reduce((sum,t)=>sum+n(t.targetValue??t.calculatedTarget??t.monthlyTarget??t.target??t.value??0),0);
   return {actual,target,gap:target-actual,pct:target>0?actual/target*100:null};

function branchHealthPanel(bs,title='Branch performance distribution'){
 const cats=[

 ];

function ytdMonths(){const year=String(month).slice(0,4),end=Number(String(month).slice(5,7)||1);return Array.from({length:end},(_,i)=>`${year}-${String(i+1).padStart(2,'0')}`)}
function ytdTarget(branchCode,metric){const months=ytdMonths();return months.reduce((sum,mo)=>{const rows=targets.filter(x=>String(x.branchCode)===String(branchCode)&&normMetric(x.metric||x.product)===metric&&monthKey(x.month||x.targetMonth||x.period)===mo);const latest=rows.sort((a,b)=>n(a.updatedAt?.seconds||Date.parse(a.updatedAt||''))-n(b.updatedAt?.seconds||Date.parse(b.updatedAt||''))).slice(-1)[0];return sum+(latest?Math.max(0,n(latest.targetValue??latest.value??latest.target??0)):0)},0)}
function ytdAchieved(branchCode,metric){const months=new Set(ytdMonths());return eod.filter(x=>String(x.branchCode)===String(branchCode)&&months.has(monthKey(x.date))&&normMetric(x.metric)===metric).reduce((sum,x)=>sum+n(x.actual),0)}
function productwisePredictionPanel(bs,level='branch'){
 const groups=new Map();for(const b of bs){const key=level==='division'?String(b.divisionId||'Unassigned'):level==='rom'?branchRomCode(b):String(b.branchCode);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(b)}
 const groupLabel=(key,items)=>level==='branch'?(items[0].branchName||items[0].name||key):level==='rom'?(roms.find(r=>String(r.empCode)===key)?.displayName||roms.find(r=>String(r.empCode)===key)?.name||items[0]?.romName||key):key;
 const todayDate=new Date((date||today())+'T12:00:00'),daysInMonth=new Date(todayDate.getFullYear(),todayDate.getMonth()+1,0).getDate(),elapsed=Math.max(1,Math.min(daysInMonth,todayDate.getDate())),remaining=Math.max(0,daysInMonth-elapsed);
 return METRICS.map(metric=>{const rows=[...groups.entries()].map(([key,items])=>{const mt=items.reduce((s,b)=>s+metricTarget(b.branchCode,metric),0),ma=items.reduce((s,b)=>s+mtd(b.branchCode,metric),0),yt=items.reduce((s,b)=>s+ytdTarget(b.branchCode,metric),0),ya=items.reduce((s,b)=>s+ytdAchieved(b.branchCode,metric),0),proj=ma/elapsed*daysInMonth,needed=remaining?Math.max(0,mt-ma)/remaining:Math.max(0,mt-ma);return {key,label:groupLabel(key,items),count:items.length,mt,ma,mgap:mt-ma,mpct:mt?ma/mt*100:0,yt,ya,ygap:yt-ya,ypct:yt?ya/yt*100:0,proj,forecastGap:mt-proj,needed}});const sum=k=>rows.reduce((s,r)=>s+r[k],0),mt=sum('mt'),ma=sum('ma'),yt=sum('yt'),ya=sum('ya');return `<section class="card product-prediction-card"><div class="section"><h3>${esc(metric)} — ${metricUnit(metric)==='amount'?'₹ amount':'count'} prediction</h3><span>${rows.length} ${esc(level)} groups</span></div><div class="target-rule-note"><span class="rule-icon">↻</span><div><b>Fixed monthly target · independent YTD tracking</b><small>MTD achievement resets to zero at the start of each month. Any MTD shortfall or surplus does not change the next month's target. YTD adds the month's actual achievements and fixed monthly targets separately, so the cumulative YTD gap shows the remaining shortfall or surplus. This rule applies to every product.</small></div></div><div class="kpi-grid"><div class="mini-kpi"><span>MTD achievement</span><b>${achievementBadge(mt?ma/mt*100:0)}</b><small>${metricValue(ma,metric)} / ${metricValue(mt,metric)}</small></div><div class="mini-kpi"><span>MTD gap (signed)</span><b class="${mt-ma>0?'negative':'positive'}">${metricValue(mt-ma,metric)}</b><small>Negative means above target</small></div><div class="mini-kpi"><span>YTD achievement</span><b>${achievementBadge(yt?ya/yt*100:0)}</b><small>${metricValue(ya,metric)} / ${metricValue(yt,metric)}</small></div><div class="mini-kpi"><span>YTD gap (signed)</span><b class="${yt-ya>0?'negative':'positive'}">${metricValue(yt-ya,metric)}</b><small>Negative means YTD target exceeded</small></div></div><div class="tablewrap"><table><thead><tr><th>${esc(level==='division'?'Division':level==='rom'?'ROM':'Branch')}</th><th>Branches</th><th>MTD Target</th><th>MTD Achieved</th><th>MTD Gap</th><th>MTD %</th><th>YTD Target</th><th>YTD Achieved</th><th>YTD Gap</th><th>YTD %</th><th>Projected MTD month-end</th><th>Needed / remaining day</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.label)}</b>${level==='branch'?`<br><small>${esc(r.key)}</small>`:''}</td><td>${r.count}</td><td>${metricValue(r.mt,metric)}</td><td>${metricValue(r.ma,metric)}</td><td class="${r.mgap>0?'negative':'positive'}">${metricValue(r.mgap,metric)}</td><td>${achievementBadge(r.mpct)}</td><td>${metricValue(r.yt,metric)}</td><td>${metricValue(r.ya,metric)}</td><td class="${r.ygap>0?'negative':'positive'}">${metricValue(r.ygap,metric)}</td><td>${achievementBadge(r.ypct)}</td><td>${metricValue(r.proj,metric)}<br><small class="${r.forecastGap>0?'negative':'positive'}">${r.forecastGap>0?'Forecast gap: '+metricValue(r.forecastGap,metric):'On pace / above target'}</small></td><td>${metricValue(r.needed,metric)}</td></tr>`).join('')||`<tr><td colspan="12">No ${esc(metric)} records in this scope.</td></tr>`}<tr class="total-row"><th>Scope total</th><th>${bs.length}</th><th>${metricValue(mt,metric)}</th><th>${metricValue(ma,metric)}</th><th class="${mt-ma>0?'negative':'positive'}">${metricValue(mt-ma,metric)}</th><th>${achievementBadge(mt?ma/mt*100:0)}</th><th>${metricValue(yt,metric)}</th><th>${metricValue(ya,metric)}</th><th class="${yt-ya>0?'negative':'positive'}">${metricValue(yt-ya,metric)}</th><th>${achievementBadge(yt?ya/yt*100:0)}</th><th>${metricValue(ma/elapsed*daysInMonth,metric)}</th><th>${metricValue(remaining?Math.max(0,mt-ma)/remaining:Math.max(0,mt-ma),metric)}</th></tr></tbody></table></div></section>`}).join('');
}
function forecastPanel(bs,title='Target achievement forecast'){
 const now=new Date((date||today())+'T12:00:00'), daysInMonth=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(), elapsed=Math.max(1,Math.min(daysInMonth,now.getDate())), remaining=Math.max(0,daysInMonth-elapsed);
 const rows=METRICS.map(m=>{const target=bs.reduce((s,b)=>s+metricTarget(b.branchCode,m),0),ach=bs.reduce((s,b)=>s+mtd(b.branchCode,m),0),pace=ach/elapsed,projected=pace*daysInMonth,gap=Math.max(0,target-ach),required=remaining?gap/remaining:gap,forecastGap=Math.max(0,target-projected),percent=target?ach/target*100:0;return {m,target,ach,pace,projected,gap,required,forecastGap,percent}});
 const amountRows=rows.filter(x=>metricUnit(x.m)==='amount'),countRows=rows.filter(x=>metricUnit(x.m)==='count');
 const focus=[...rows].filter(x=>x.target>0).sort((a,b)=>(b.forecastGap/Math.max(1,b.target))-(a.forecastGap/Math.max(1,a.target))).slice(0,2);
 return `<section class="card forecast-card"><div class="section"><h3>🎯 ${esc(title)}</h3><span>${elapsed}/${daysInMonth} days elapsed</span></div><p class="sub">Projection assumes the month-to-date average continues. It is a planning estimate, not a guarantee.</p><div class="tablewrap"><table><thead><tr><th>Product</th><th>Monthly Target</th><th>Achieved MTD</th><th>Projected Month-End</th><th>Projected Shortfall</th><th>Required per remaining day</th><th>Progress</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.m)}</b><br><small>${metricUnit(x.m)==='count'?'Count':'Amount (₹)'}</small></td><td>${metricValue(x.target,x.m)}</td><td>${metricValue(x.ach,x.m)}</td><td>${metricValue(x.projected,x.m)}</td><td class="${x.forecastGap?'negative':'positive'}">${metricValue(x.forecastGap,x.m)}</td><td>${metricValue(x.required,x.m)}</td><td>${achievementBadge(x.percent)}</td></tr>`).join('')}</tbody></table></div><div class="forecast-insights"><div><b>Priority products</b><p>${focus.length?focus.map(x=>`${esc(x.m)}: projected shortfall ${metricValue(x.forecastGap,x.m)} at the current pace.`).join('<br>'):'Set monthly targets to calculate product-level effort requirements.'}</p></div><div><b>Separate product tracking</b><p>ELA, Gold Loan, FD and Insurance each have an independent target, achievement, gap and forecast. No cross-product totals or combined commitment amount are shown.</p></div></div></section>`;

async function saveCalling(branchCode){
  if(!roleIs('ROM'))return alert('Only ROM can submit calling reports.');
  const branch=branches.find(b=>String(b.branchCode)===String(branchCode));
  if(!branch)return alert('This branch is not mapped or is not available in your assigned region. Refresh and try again.');
  const fields=['notInterested','switchOff','cbRejected','followUp','nonContactable','ringingNoResponse','tbd','disbursed'],v={};
  for(const f of fields){
    const i=$(`call_${branchCode}_${f}`);
    if(!i||i.value.trim()===''||!Number.isFinite(Number(i.value))||Number(i.value)<0||!Number.isInteger(Number(i.value)))return alert(`Enter a valid whole number (0 or higher) for ${f}.`);
    v[f]=Number(i.value);
  }
  const totalCalls=fields.reduce((s,f)=>s+v[f],0);
  const id=`${date}_${branchCode}`.replace(/[^A-Za-z0-9_-]/g,'_');
  try{
    await db.collection('callingReports').doc(id).set({...v,totalCalls,date,month:date.slice(0,7),branchCode:String(branch.branchCode),branchName:String(branch.branchName||branch.name||branch.branchCode),divisionId:String(branch.divisionId||user.divisionId||''),regionId:String(branch.regionId||user.regionId||user.empCode),romCode:String(user.empCode),updatedBy:user.empCode,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    await refreshData();render();showSubmissionPopup();
  }catch(e){console.error('Calling report save failed',e);alert('Calling report save failed: '+(e.code||e.message))}
}

async function saveAllProductTargets(){

 const specs=[];

 }catch(e){console.error('saveAllProductTargets failed',e);if(status)status.innerHTML=`<div class="notice error">Save failed: ${esc(e.code||'unknown')} — ${esc(e.message||'Firestore rejected the write')}. Some earlier batches may already have saved; check the target register before retrying.</div>`;alert('Target save failed: '+(e.code||'unknown')+' — '+(e.message||'Check Firestore rules.'));}

}

function previousMonthKey(){const d=new Date(`${month}-01T12:00:00`);d.setMonth(d.getMonth()-1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}

async function normalizeRomRegionIds(){
 if(!roleIs('ZOH'))return alert('Only ZOH can repair organization mappings.');
 const phrase=prompt('This will standardize regionId to the ROM employee code in branch records, branch assignments, ROM assignments, and ROM user profiles. Type NORMALIZE REGION IDS to continue.');
 if(phrase!=='NORMALIZE REGION IDS')return alert('No changes made.');
 try{
  const [branchSnap,userSnap,mapSnap]=await Promise.all([
   db.collection('branches').get(),
   db.collection('users').get(),
   db.collection('organizationMappings').get()
  ]);
  const writes=[];
  branchSnap.docs.forEach(d=>{const x=d.data(),code=String(x.romCode||'').trim();if(code&&String(x.regionId||'')!==code)writes.push({ref:d.ref,data:{regionId:code,updatedBy:user.empCode,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}})});
  mapSnap.docs.forEach(d=>{const x=d.data();if(x.type==='branchAssignment'||x.type==='romAssignment'){const code=String(x.romCode||'').trim();if(code&&String(x.regionId||'')!==code)writes.push({ref:d.ref,data:{regionId:code,updatedBy:user.empCode,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}})}});
  userSnap.docs.forEach(d=>{const x=d.data();if(String(x.role||'').toUpperCase()==='ROM'){const code=String(x.romCode||x.empCode||'').trim();if(code&&String(x.regionId||'')!==code)writes.push({ref:d.ref,data:{regionId:code,updatedBy:user.empCode,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}})}});
  if(!writes.length)return alert('No changes needed. All applicable regionId values already match ROM codes.');
  for(let i=0;i<writes.length;i+=400){const batch=db.batch();writes.slice(i,i+400).forEach(w=>batch.set(w.ref,w.data,{merge:true}));await batch.commit();}
  await refreshData();render();alert(`Completed. Updated ${writes.length} records so regionId matches the ROM code. Please test with a ROM account.`);
 }catch(e){console.error('Region ID normalization failed',e);alert('Could not complete the repair: '+(e.code||e.message)+'. Check Firestore Rules for read/write access to branches, users, and organizationMappings. Some earlier batches may already have been saved; refresh and run again after fixing permissions.');}
}

async function submitDomReview(id){if(!roleIs('DOM'))return alert('Only DOM can submit the review report.');const x=zohReviewRequests.find(r=>r.id===id);if(!x||normScope(x.divisionId)!==normScope(user.divisionId))return alert('This escalation is outside your division.');const report=prompt('Enter the full DOM review report: ROM commitment verification, achieved status, gap, reason and corrective action.');if(!report?.trim())return alert('A complete review report is required.');try{await db.collection('zohReviewRequests').doc(id).update({status:'DOM_REPORTED',domReport:report.trim(),domEmpCode:user.empCode,domName:user.name,domReportedAt:firebase.firestore.FieldValue.serverTimestamp()});await refreshData();render();showSubmissionPopup()}catch(e){alert('Could not submit DOM report: '+(e.code||e.message)+' — Firestore rules may need updating.')}}

// Admin-only destructive reset for clearing trial business data before production.
const RESET_COLLECTIONS = [
  'monthlyTargets','elaBases','bodCommitments','eodReports','eodAudit',
  'callingReports','goldLoanWeekly','correctionRequests','commitmentReviews',
  'zohReviewRequests','cihReports'

function resetDataPage(){

 <div class="card" style="border-color:#fecaca;background:linear-gradient(145deg,#fff,#fff7f7)">
 <div class="notice error"><b>Danger zone — permanent deletion</b><br>This action permanently deletes business/commitment documents in the collections listed below. It does not delete staff profiles, branch assignments, organization mappings, or Firebase Authentication accounts.</div>

 <ul>${RESET_COLLECTIONS.map(x=>`<li><code>${x}</code></li>`).join('')}</ul>
 <p class="sub">Use this only after the ZOH trial has finished and after exporting any records that must be retained. This cannot be undone.</p>
 <div class="inputgroup"><label for="resetPhrase">Type <b>RESET TN HUB</b> to enable the reset</label><input id="resetPhrase" autocomplete="off" placeholder="RESET TN HUB" oninput="const b=document.getElementById('resetBtn');if(b)b.disabled=this.value.trim()!=='RESET TN HUB'"></div>
 <div class="actions"><button id="resetBtn" class="btn" style="background:#b91c1c;color:#fff" disabled onclick="runAdminDataReset()">Permanently reset trial data</button></div>
 <div id="resetProgress" class="notice hidden" style="margin-top:12px;white-space:pre-line"></div>
 </div>`;
}
async function deleteCollectionInChunks(name){
 let deleted=0;
 while(true){
  const snap=await db.collection(name).limit(400).get();
  if(snap.empty)break;
  const batch=db.batch();snap.docs.forEach(doc=>batch.delete(doc.ref));
  await batch.commit();deleted+=snap.size;
 }
 return deleted;
}
async function runAdminDataReset(){
 if(!roleIs('SYSTEM_ADMIN'))return alert('Access denied. Only SYSTEM_ADMIN can reset trial data.');
 if(document.getElementById('resetPhrase')?.value.trim()!=='RESET TN HUB')return alert('Type RESET TN HUB exactly to confirm.');
 const final=prompt('FINAL CONFIRMATION: This permanently deletes trial business records but keeps users, branches and organization mappings. Type DELETE TRIAL DATA to continue.');
 if(final!=='DELETE TRIAL DATA')return alert('Reset cancelled. No records were deleted.');
 const btn=document.getElementById('resetBtn'),status=document.getElementById('resetProgress');if(btn)btn.disabled=true;if(status){status.classList.remove('hidden');status.textContent='Starting reset…';}
 let total=0;const results=[];
 try{
  for(const name of RESET_COLLECTIONS){
   if(status)status.textContent=`Reset in progress…\nCompleted: ${results.map(x=>x.name+': '+x.count).join(', ')||'none'}\nProcessing: ${name}`;
   const count=await deleteCollectionInChunks(name);total+=count;results.push({name,count});
  }
  await refreshData();render();
  alert(`Trial data reset completed. ${total} documents deleted across ${results.length} collections. Staff profiles, branches and organization mappings were preserved.`);
 }catch(e){
  console.error('Admin trial reset failed',e);
  alert('Reset stopped at a collection due to a permission/network error: '+(e.code||e.message)+'. Some earlier collections may already have been cleared. Check Firestore rules and review the data before retrying.');
 }finally{const b=document.getElementById('resetBtn');if(b)b.disabled=false;}
}

function startRealtime(){
 if(!user||realtimeStarted)return;realtimeStarted=true;
 const names=['organizationMappings','branches','monthlyTargets','elaBases','bodCommitments','eodReports','callingReports','correctionRequests','commitmentReviews','zohReviewRequests','cihReports','goldLoanWeekly',...(roleIs('ZOH','SYSTEM_ADMIN')?['contests']:[])];
 const setMap={organizationMappings:'mappings',monthlyTargets:'targets',elaBases:'bases',bodCommitments:'bod',eodReports:'eod',callingReports:'calling',correctionRequests:'correctionRequests',commitmentReviews:'commitmentReviews',zohReviewRequests:'zohReviewRequests',cihReports:'cihReports',goldLoanWeekly:'goldLoanWeekly',contests:'contests'};
 names.forEach(name=>{try{let q=db.collection(name);if(!roleIs('ZOH','SYSTEM_ADMIN')){if(user.role==='DOM'&&user.divisionId)q=q.where('divisionId','==',user.divisionId);else if(user.role==='ROM'&&user.empCode&&name!=='branches'&&name!=='organizationMappings')q=q.where('romCode','==',user.empCode);else if(user.role==='ROM'&&user.regionId)q=q.where('regionId','==',user.regionId);else if(!roleIs('ZOH','SYSTEM_ADMIN'))return;}
 const unsub=q.onSnapshot(snap=>{window.__tnHubSync.lastUpdate=Date.now();window.__tnHubSync.errors=0;window.__tnHubSync.lastCollection=name;const rows=snap.docs.map(d=>({id:d.id,...d.data()}));if(name==='branches')branches=rows.filter(x=>x.active!==false);else if(name==='organizationMappings')mappings=rows;else if(setMap[name]){if(name==='monthlyTargets')targets=rows;else if(name==='elaBases')bases=rows;else if(name==='bodCommitments')bod=rows;else if(name==='eodReports')eod=rows;else if(name==='callingReports')calling=rows;else if(name==='correctionRequests')correctionRequests=rows;else if(name==='commitmentReviews')commitmentReviews=rows;else if(name==='zohReviewRequests')zohReviewRequests=rows;else if(name==='cihReports')cihReports=rows;else if(name==='goldLoanWeekly')goldLoanWeekly=rows;else if(name==='contests')contests=rows;}
 if(name==='branches'||name==='organizationMappings'){const branchMaps=mappings.filter(x=>x.type==='branchAssignment');if(branchMaps.length)branches=branches.map(b=>{const m=branchMaps.find(x=>String(x.branchCode)===String(b.branchCode||b.code));return m?{...b,...m,branchCode:String(m.branchCode)}:{...b,branchCode:String(b.branchCode||b.code||'')};});}
 clearTimeout(realtimeRenderTimer);realtimeRenderTimer=setTimeout(()=>{if(user&&document.visibilityState!=='hidden')render()},120);
 },err=>{window.__tnHubSync.errors=(window.__tnHubSync.errors||0)+1;window.__tnHubSync.lastError=err&&err.code||'unknown';console.warn('Realtime listener failed for '+name,err);});realtimeUnsubs.push(unsub);
 }catch(e){console.warn('Could not attach realtime listener for '+name,e)}});
}
function stopRealtime(){realtimeUnsubs.forEach(fn=>{try{fn()}catch(_){}});realtimeUnsubs=[];realtimeStarted=false;}

auth.onAuthStateChanged(fu=>{if(fu)afterAuth(fu);else{stopRealtime();user=null;profile=null;rootLogin();if(loginMessage)msg(loginMessage,loginType)}});
</script>

<script id="tn-hub-live-sync-controller">
(function(){
  'use strict';
  const state=window.__tnHubSync||(window.__tnHubSync={lastUpdate:0,lastResync:0,errors:0,resyncing:false});
  function paint(){
    const box=document.getElementById('syncStatus'),label=document.getElementById('syncStatusText');
    if(!box||!label)return;
    box.classList.remove('is-live','is-stale','is-error');
    if(!navigator.onLine){box.classList.add('is-error');label.textContent='Offline';return;}
    if(state.errors){box.classList.add('is-error');label.textContent='Sync issue';return;}
    const age=state.lastUpdate?Math.max(0,Math.floor((Date.now()-state.lastUpdate)/1000)):null;
    if(age===null){box.classList.add('is-stale');label.textContent='Connecting…';return;}
    if(age<=60){box.classList.add('is-live');label.textContent=age<5?'Live · just now':'Live · '+age+'s ago';}
    else{box.classList.add('is-stale');label.textContent='Checking sync…';}
  }
  async function reconcile(force){
    if(!window.__tnHubSync||!navigator.onLine||document.visibilityState==='hidden'||(typeof user==='undefined'||!user)||typeof window.refreshData!=='function')return;
    if(state.resyncing)return;
    const now=Date.now();
    if(!force&&now-(state.lastResync||0)<45000)return;
    state.resyncing=true;state.lastResync=now;
    try{
      await window.refreshData();
      state.lastUpdate=Date.now();state.errors=(window.collectionErrors&&window.collectionErrors.length)?window.collectionErrors.length:0;
      // Avoid replacing a form while the user is actively editing it.
      const el=document.activeElement;
      const editing=el&&(/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)||el.isContentEditable);
      if(!editing&&typeof user!=='undefined'&&user&&typeof render==='function')render();
    }catch(err){state.errors=(state.errors||0)+1;state.lastError=err&&err.code||'unknown';console.warn('Periodic live-data reconciliation failed',err);}
    finally{state.resyncing=false;paint();}
  }
  window.addEventListener('online',()=>{state.errors=0;paint();reconcile(true)});
  window.addEventListener('offline',paint);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reconcile(true);paint()});
  window.addEventListener('tnhub:force-sync',()=>reconcile(true));
  // A 45-second safety reconciliation backs up Firestore realtime listeners.
  // The onSnapshot listeners remain the primary channel and normally update much sooner.
  setInterval(()=>{reconcile(false);paint()},5000);
  setTimeout(()=>reconcile(true),2500);
})();
</script>
